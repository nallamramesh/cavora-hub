<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="swooshGrad" x1="5" y1="85" x2="95" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="25%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="75%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="uGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="lineLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="lineRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem on the left -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" fill="#0C0C12" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <path d="M62 20 C42 16 20 28 17 50 C14 70 30 84 50 84 C56 84 62 82 66 79" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M36 32 L36 68" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M36 50 L56 50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 32 L56 50" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M56 48 C56 64 54 74 68 76 C78 77 86 68 87 56 C88 44 80 34 72 31" stroke="url(#swooshGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M26 74 C36 82 52 83 68 78 C76 75 84 69 88 62" stroke="url(#swooshGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="78" cy="27" r="2.8" fill="#06B6D4"/>
    <circle cx="86" cy="35" r="2.2" fill="#38BDF8"/>
    <circle cx="91" cy="48" r="1.8" fill="#FBBF24"/>
    <circle cx="88" cy="68" r="2.2" fill="#F97316"/>
    <circle cx="73" cy="85" r="2" fill="#EC4899"/>
    <circle cx="34" cy="84" r="1.6" fill="#8B5CF6"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(130, 25)">
    <!-- Cavora -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" fill="#FFFFFF" letter-spacing="1">Cavora</text>
    
    <!-- Hub -->
    <text x="145" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38">
      <tspan fill="url(#hGrad)">H</tspan>
      <tspan fill="url(#uGrad)">u</tspan>
      <tspan fill="url(#bGrad)">b</tspan>
    </text>

    <!-- Subtitle: GRAPHICS -->
    <line x1="0" y1="52" x2="50" y2="52" stroke="url(#lineLeft)" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#E4E4E7" letter-spacing="6" text-anchor="middle">GRAPHICS</text>
    <line x1="170" y1="52" x2="220" y2="52" stroke="url(#lineRight)" stroke-width="2" stroke-linecap="round"/>

    <!-- Tagline -->
    <text x="110" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="12" fill="#22D3EE" letter-spacing="0.5" text-anchor="middle">Design. Create. Inspire.</text>
  </g>
</svg>
